<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Platform — Dashboard Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0b0e;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP BAR / HEADER */
    header {
      height: 60px;
      background-color: #16161e;
      border-bottom: 1px solid #272736;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .coin-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      color: #eab308;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-badge {
      background-color: #272736;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #93c5fd;
    }

    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }

    /* MAIN CONTENT AREA */
    main {
      flex: 1;
      position: relative;
      background-color: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">BLOX PLATFORM</div>
    <div class="user-info">
      <div class="coin-badge">
        <span>🪙 Monete:</span>
        <span id="coinDisplay">0</span>
      </div>
      <div class="user-badge" id="usernameDisplay">Utente</div>
      <button class="btn-logout" onclick="logout()">Esci</button>
    </div>
  </header>

  <!-- GAME CONTAINER -->
  <main>
    <iframe id="gameFrame" src="about:blank"></iframe>
  </main>

  <script>
    // --- GESTIONE UTENTE E SESSIONE ---
    let currentUser = localStorage.getItem('bloxi_session');

    // Se non c'è una sessione attiva, torna al Login (index.html)
    if (!currentUser) {
      window.location.href = "index.html";
    }

    // Carica dati utente dal localStorage DataStore
    let users = JSON.parse(localStorage.getItem('bloxi_users')) || {};
    let userData = users[currentUser] || { coins: 100 };

    // Mostra dati nella barra in alto
    document.getElementById('usernameDisplay').textContent = currentUser;
    document.getElementById('coinDisplay').textContent = userData.coins;

    // --- CARICAMENTO GIOCO ---
    var gameUrl = "game.html"; 
    document.getElementById('gameFrame').src = gameUrl;

    // --- ASCOLTATORE PER AGGIORNAMENTO MONETE IN TEMPO REALE ---
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'UPDATE_COINS') {
        // Aggiorna la grafica dell'Hub all'istante quando il gioco invia nuove monete
        document.getElementById('coinDisplay').textContent = event.data.coins;
      }
    });

    // --- LOGOUT ---
    function logout() {
      localStorage.removeItem('bloxi_session');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

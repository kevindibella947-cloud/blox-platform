<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Platform - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0b0b0e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #16161e; border: 1px solid #272736; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
    h2 { margin-bottom: 20px; color: #a855f7; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0b0b0e; border: 1px solid #272736; border-radius: 6px; color: white; outline: none; }
    button { width: 100%; padding: 10px; background: #9333ea; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #7e22ce; }
  </style>
</head>
<body>

<div class="card">
  <h2>Blox Platform</h2>
  <input type="text" id="username" placeholder="Nome utente...">
  <button onclick="login()">Gioca ora</button>
</div>

<script>
  function login() {
    const user = document.getElementById('username').value.trim() || 'Ospite';
    
    // Salva sessione e crea l'utente se non esiste
    localStorage.setItem('bloxi_session', user);
    
    let users = JSON.parse(localStorage.getItem('bloxi_users')) || {};
    if (!users[user]) {
      users[user] = { coins: 100 };
      localStorage.setItem('bloxi_users', JSON.stringify(users));
    }

    // Entra nell'Hub
    window.location.href = "./hub.html";
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Platform - Login Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0b0b0e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; position: relative; overflow: hidden; }
    
    /* PULSANTE SUPERVISIONE IN ALTO A SINISTRA */
    .admin-top-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #272736;
      border: 1px solid #3b82f6;
      color: #60a5fa;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      z-index: 5;
    }
    .admin-top-btn:hover { background: #3b82f6; color: white; }

    /* CARD DI LOGIN */
    .card { background: #16161e; border: 1px solid #272736; padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 2; }
    h2 { margin-bottom: 8px; color: #a855f7; font-size: 26px; }
    p.subtitle { font-size: 13px; color: #9aa4b8; margin-bottom: 20px; }
    .input-group { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: #a855f7; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px; background: #0b0b0e; border: 1px solid #272736; border-radius: 6px; color: white; font-size: 14px; outline: none; }
    input:focus { border-color: #a855f7; }
    
    .btn-main { width: 100%; padding: 12px; background: linear-gradient(135deg, #9333ea, #3b82f6); border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
    .btn-main:hover { opacity: 0.9; }

    .switch-mode { margin-top: 20px; font-size: 13px; color: #9aa4b8; }
    .switch-link { color: #3b82f6; font-weight: bold; cursor: pointer; text-decoration: underline; margin-left: 4px; }

    #msg { font-size: 13px; margin-top: 15px; display: none; padding: 8px; border-radius: 6px; }
    .error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .success { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }

    /* CAPTCHA MODALE PER ADMIN */
    .captcha-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .captcha-card {
      background: #16161e;
      border: 2px solid #eab308;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
    .captcha-card h3 { color: #eab308; margin-bottom: 10px; }
    .captcha-card p { font-size: 13px; color: #9aa4b8; margin-bottom: 15px; }

    /* MODALE SUPERVISIONE ACCOUNT */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: #16161e;
      border: 1px solid #a855f7;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      padding: 20px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #272736; padding-bottom: 10px; }
    .modal-header h3 { color: #a855f7; font-size: 18px; }
    .btn-close { background: none; border: none; color: #ef4444; font-size: 18px; font-weight: bold; cursor: pointer; }
    .account-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
    .account-item { background: #0b0b0e; border: 1px solid #272736; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .account-item .badge-admin { background: #9333ea; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- PULSANTE SUPERVISIONE IN ALTO A SINISTRA -->
  <button class="admin-top-btn" onclick="apriSupervisione()">
    🔍 Supervisione Account
  </button>

  <!-- CARD LOGIN / REGISTRAZIONE -->
  <div class="card">
    <h2 id="title">BLOX PLATFORM</h2>
    <p class="subtitle" id="subtitle">Inserisci le tue credenziali per accedere</p>
    
    <div class="input-group">
      <label for="username">Nickname</label>
      <input type="text" id="username" placeholder="Inserisci nickname...">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Inserisci password...">
    </div>

    <button class="btn-main" id="submitBtn" onclick="inviaForm()">ACCEDI</button>

    <div class="switch-mode" id="switchText">
      Non hai un account? <span class="switch-link" onclick="cambiaModalita()">Registrati</span>
    </div>

    <div id="msg"></div>
  </div>

  <!-- MODALE CAPTCHA PER ADMIN -->
  <div class="captcha-overlay" id="captchaModal">
    <div class="captcha-card">
      <h3>🤖 CAPTCHA ADMIN</h3>
      <p>Inserisci il codice segreto di verifica per procedere:</p>
      <input type="password" id="captchaInput" placeholder="Inserisci codice...">
      <button class="btn-main" style="background: #eab308; color: #000; margin-top: 15px;" onclick="verificaCaptcha()">CONFERMA CODICE</button>
      <div id="captchaError" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Codice Errato!</div>
    </div>
  </div>

  <!-- PANNELLO MODALE ADMIN (SUPERVISIONE ACCOUNT) -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📊 Lista Account Registrati</h3>
        <button class="btn-close" onclick="chiudiSupervisione()">✕</button>
      </div>
      <div class="account-list" id="accountListContainer"></div>
    </div>
  </div>

<script>
  let isLoginMode = true;
  const ADMIN_NAME = "huggy_huggy223";
  const ADMIN_PASS = "Kevindibella18";
  const SECRET_PIN = "947947";

  // AGGIORNA E FORZA L'ACCOUNT ADMIN CON LA NUOVA PASSWORD
  (function initAdmin() {
    let users = JSON.parse(localStorage.getItem('bloxi_users')) || {};
    users[ADMIN_NAME] = {
      password: ADMIN_PASS,
      coins: 999999,
      role: "admin"
    };
    localStorage.setItem('bloxi_users', JSON.stringify(users));
  })();

  function cambiaModalita() {
    isLoginMode = !isLoginMode;
    const subtitle = document.getElementById('subtitle');
    const submitBtn = document.getElementById('submitBtn');
    const switchText = document.getElementById('switchText');
    const msgEl = document.getElementById('msg');
    msgEl.style.display = "none";

    if (isLoginMode) {
      subtitle.textContent = "Inserisci le tue credenziali per accedere";
      submitBtn.textContent = "ACCEDI";
      switchText.innerHTML = 'Non hai un account? <span class="switch-link" onclick="cambiaModalita()">Registrati</span>';
    } else {
      subtitle.textContent = "Crea un nuovo account per iniziare";
      submitBtn.textContent = "REGISTRATI";
      switchText.innerHTML = 'Hai già un account? <span class="switch-link" onclick="cambiaModalita()">Accedi</span>';
    }
  }

  function mostraMessaggio(testo, tipo) {
    const msgEl = document.getElementById('msg');
    msgEl.textContent = testo;
    msgEl.className = tipo;
    msgEl.style.display = "block";
  }

  function inviaForm() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();

    if (!user || !pass) {
      mostraMessaggio("Inserisci sia Nickname che Password!", "error");
      return;
    }

    let users = JSON.parse(localStorage.getItem('bloxi_users')) || {};

    if (isLoginMode) {
      // LOGIC ACCESSO
      if (!users[user]) {
        mostraMessaggio("Utente non trovato! Clicca su Registrati.", "error");
        return;
      }
      if (users[user].password !== pass) {
        mostraMessaggio("Password errata!", "error");
        return;
      }

      // SE È L'ACCOUNT ADMIN MOSTRA IL CAPTCHA
      if (user === ADMIN_NAME) {
        document.getElementById('captchaInput').value = "";
        document.getElementById('captchaError').style.display = "none";
        document.getElementById('captchaModal').style.display = "flex";
      } else {
        completaLogin(user);
      }

    } else {
      // LOGIC REGISTRAZIONE
      if (users[user]) {
        mostraMessaggio("Nickname già occupato!", "error");
        return;
      }

      users[user] = { password: pass, coins: 100 };
      localStorage.setItem('bloxi_users', JSON.stringify(users));
      completaLogin(user);
    }
  }

  function verificaCaptcha() {
    const code = document.getElementById('captchaInput').value.trim();
    if (code === SECRET_PIN) {
      document.getElementById('captchaModal').style.display = "none";
      completaLogin(ADMIN_NAME);
    } else {
      document.getElementById('captchaError').style.display = "block";
    }
  }

  function completaLogin(user) {
    localStorage.setItem('bloxi_session', user);
    mostraMessaggio("Accesso effettuato! Reindirizzamento...", "success");
    setTimeout(() => { window.location.href = "./hub.html"; }, 600);
  }

  // PANNELLO DI SUPERVISIONE ACCOUNT
  function apriSupervisione() {
    const pinVerifica = prompt("Inserisci la chiave segreta per la supervisione:");
    if (pinVerifica !== SECRET_PIN) {
      alert("Accesso Negato: Chiave di sicurezza errata!");
      return;
    }

    const container = document.getElementById('accountListContainer');
    container.innerHTML = "";
    
    let users = JSON.parse(localStorage.getItem('bloxi_users')) || {};
    
    Object.keys(users).forEach(u => {
      const item = document.createElement('div');
      item.className = "account-item";
      const isAdmin = u === ADMIN_NAME;
      
      item.innerHTML = `
        <div>
          <strong>${u}</strong> ${isAdmin ? '<span class="badge-admin">ADMIN</span>' : ''}
          <div style="font-size:11px; color:#8a94a6;">Pass: ${users[u].password}</div>
        </div>
        <div style="color:#eab308; font-weight:bold;">🪙 ${users[u].coins || 0}</div>
      `;
      container.appendChild(item);
    });

    document.getElementById('adminModal').style.display = "flex";
  }

  function chiudiSupervisione() {
    document.getElementById('adminModal').style.display = "none";
  }
</script>

</body>
</html>
